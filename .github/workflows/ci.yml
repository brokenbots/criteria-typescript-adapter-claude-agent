name: CI

on:
  push:
    branches: [main, adapter-v2]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: criteria-typescript-adapter-claude-agent
      - name: Checkout SDK (sibling file dependency)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: brokenbots/criteria-typescript-adapter-sdk
          # CRI-180: SDK surface with helpers.tools.callAdapterTool (CRI-179).
          # CRI-306: SDK main carries the per-call Execute result delivery fix
          # (CRI-305), which concurrent Executes on one wire session require.
          ref: main
          path: criteria-typescript-adapter-sdk
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Build SDK
        working-directory: criteria-typescript-adapter-sdk
        run: bun install --frozen-lockfile && bun run build
      - name: Install, build, test
        working-directory: criteria-typescript-adapter-claude-agent
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test

  # WS49 — vulnerability gate (osv-scanner). BLOCKING: reads bun.lock; tree clean.
  # Pinned google/osv-scanner-action by SHA (v2.3.8).
  osv-scan:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            ./

  # WS50 — non-blocking dependency-freshness report (bun outdated).
  deps-report:
    name: Dependency freshness (report-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: criteria-typescript-adapter-claude-agent
      - name: Checkout SDK (sibling)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: brokenbots/criteria-typescript-adapter-sdk
          # CRI-306: SDK main carries the per-call Execute result delivery fix
          # (CRI-305).
          ref: main
          path: criteria-typescript-adapter-sdk
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Build SDK
        working-directory: criteria-typescript-adapter-sdk
        run: bun install --frozen-lockfile && bun run build
      - name: Report outdated dependencies
        working-directory: criteria-typescript-adapter-claude-agent
        run: |
          bun install --frozen-lockfile
          {
            echo '### Outdated dependencies (bun outdated)'
            echo '```'
            bun outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [build-test, osv-scan]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test did not succeed"; exit 1
          fi
          if [ "${{ needs.osv-scan.result }}" != "success" ]; then
            echo "osv-scan did not succeed"; exit 1
          fi
